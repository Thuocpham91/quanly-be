volumes:
  quanly-chicken-be-service-db-data:

services:
  quanly-chicken-be-service-db:
    image: postgres:16
    platform: linux/x86_64
    container_name: quanly-chicken-be-service-db
    ports:
      - "${DB_PORT}:5432"
    environment:
      TZ: UTC
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      VIRTUAL_PATH: /quanly-chicken-be-service-db
      CORS_ORIGINS: ${CORS_ORIGINS}
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: ${VIRTUAL_PORT:-5432}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    restart: always
    volumes:
      - quanly-chicken-be-service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      timeout: 20s
      retries: 10
    networks:
      - gasy-network

  quanly-chicken-be-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: quanly-chicken-be-service:latest
    container_name: quanly-chicken-be-service
    depends_on:
      - quanly-chicken-be-service-db
    ports:
      - "${PORT}:${PORT}"
    restart: always
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      HOST: ${HOST}
      PORT: ${PORT}

      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432

      SECRETKEY: ${SECRETKEY}
      EXPIRESIN: ${EXPIRESIN}

      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: ${VIRTUAL_PORT:-9003}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}


      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_SECURE: ${MAIL_SECURE}
      MAIL_USER: ${MAIL_USER}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}

      CORS_ORIGINS: ${CORS_ORIGINS}

      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME}
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME}
    networks:
      - gasy-network

networks:
  gasy-network:
    external: true
